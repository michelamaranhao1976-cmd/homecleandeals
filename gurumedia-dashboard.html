  --accent2: #2563eb;

  --yellow: #d97706;
  --red: #dc2626;
  --border: #e5e3de;
  --badge-bg: #f0eeea;
  --score-high: #16a34a;

  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'Space Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110;
    --surface: #1c1c1a;
    --fg: #e8e6e1;
    --fg2: #9a9890;
    --accent: #f07040;
    --accent2: #60a5fa;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --border: #2a2a28;
    --badge-bg: #252523;
    --score-high: #4ade80;
    --score-mid: #fbbf24;
    --score-low: #6b7280;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110;
  --surface: #1c1c1a;
  --fg: #e8e6e1;
  --fg2: #9a9890;
  --accent: #f07040;
  --accent2: #60a5fa;
  --green: #4ade80;
  --yellow: #fbbf24;
  --red: #f87171;
  --border: #2a2a28;
  --badge-bg: #252523;
  --score-high: #4ade80;
  --score-mid: #fbbf24;
  --score-low: #6b7280;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }

.header {
  padding: 28px 0 20px;
  border-bottom: 2px solid var(--accent);
  margin-bottom: 20px;
}
.header h1 {
  font-family: var(--font-mono);
  font-size: clamp(1.25rem, 3vw, 1.75rem);
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.5px;
  color: var(--accent);
}
.header p {
  color: var(--fg2);
  font-size: 0.85rem;
  margin: 0;
}
.header .stats-row {
  display: flex;
  gap: 20px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.stat-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-variant-numeric: tabular-nums;
}
.stat-chip .num {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent);
}
.stat-chip .label {
  font-size: 0.72rem;
  color: var(--fg2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.controls input[type="text"] {
  flex: 1;
  min-width: 180px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.9rem;
}
.controls input[type="text"]::placeholder { color: var(--fg2); }
.controls select {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.85rem;
  cursor: pointer;
}

.pill-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.pill {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.results-info {
  font-size: 0.8rem;
  color: var(--fg2);
  margin-bottom: 12px;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
  margin-bottom: 40px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 0.15s;
  position: relative;
}
.card:hover { border-color: var(--accent); }
.card.is-new::after {
  content: 'NOVO';
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.6rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
  letter-spacing: 0.5px;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.card-name {
  font-weight: 700;
  font-size: 0.95rem;
  line-height: 1.3;
  min-width: 0;
}
.card-score {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 700;
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.score-high { background: color-mix(in srgb, var(--score-high) 15%, transparent); color: var(--score-high); }
.score-mid { background: color-mix(in srgb, var(--score-mid) 15%, transparent); color: var(--score-mid); }
.score-low { background: color-mix(in srgb, var(--score-low) 15%, transparent); color: var(--score-low); }

.card-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.cat-badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--badge-bg);
  color: var(--fg2);
  white-space: nowrap;
}
.cat-health { color: var(--green); background: color-mix(in srgb, var(--green) 10%, var(--badge-bg)); }
.cat-ecom { color: var(--accent2); background: color-mix(in srgb, var(--accent2) 10%, var(--badge-bg)); }
.cat-diet { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, var(--badge-bg)); }
.cat-male { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--badge-bg)); }

.card-geos {
  font-size: 0.75rem;
  color: var(--fg2);
  line-height: 1.6;
}
.geo-flag {
  display: inline-block;
  margin-right: 2px;
}

.card-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tag {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--badge-bg);
  color: var(--fg2);
  font-weight: 500;
}
.tag-vsl { color: var(--green); background: color-mix(in srgb, var(--green) 10%, var(--badge-bg)); }
.tag-checkout { color: var(--accent2); background: color-mix(in srgb, var(--accent2) 10%, var(--badge-bg)); }

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--fg2);
}
.variants-badge {
  font-family: var(--font-mono);
  font-size: 0.7rem;
}

.comp-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.comp-low { color: var(--green); }
.comp-med { color: var(--yellow); }
.comp-high { color: var(--red); }
.comp-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.comp-low .comp-dot { background: var(--green); }
.comp-med .comp-dot { background: var(--yellow); }
.comp-high .comp-dot { background: var(--red); }

.opp-bar {
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.opp-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}

.footer {
  padding: 20px 0;
  border-top: 1px solid var(--border);
  font-size: 0.72rem;
  color: var(--fg2);
  text-align: center;
}

@media (max-width: 500px) {
  .grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; }
  .controls input[type="text"] { width: 100%; }
}

// Calculate opportunity score
PRODUCTS.forEach(p => {
  const comp = COMPETITION[p.name] || 'unknown';
  let compScore = comp === 'low' ? 30 : comp === 'med' ? 15 : comp === 'high' ? 0 : 10;
  p.competition = comp;
  p.opportunity = Math.round((p.score + compScore) / 1.7);
  p.isNew = NEW_PRODUCTS.has(p.name);
});

const categories = [...new Set(PRODUCTS.map(p => p.cat))].sort();
let activeCategory = '';
let searchTerm = '';
let sortBy = 'opportunity';
let geoFilter = '';

function getCatClass(cat) {
  if (cat.includes('Health')) return 'cat-health';
  if (cat.includes('eCommerce')) return 'cat-ecom';
  if (cat.includes('Diet') || cat.includes('Brain') || cat.includes('Skin') || cat.includes('Hair')) return 'cat-diet';
  if (cat.includes('Male') || cat.includes('Women')) return 'cat-male';
  return '';
}

function getScoreClass(score) {
  if (score >= 110) return 'score-high';
  if (score >= 70) return 'score-mid';
  return 'score-low';
}

function renderGeos(geosStr) {
  return geosStr.split(',').map(g => {
    const flag = GEO_FLAGS[g] || g;
    return '<span class="geo-flag" title="' + g + '">' + flag + '</span>';
  }).join('');
}

function renderTags(tagsStr) {
  if (!tagsStr) return '';
  return tagsStr.split(',').map(t => {
    let cls = 'tag';
    if (t.includes('VSL')) cls += ' tag-vsl';
    if (t.includes('Checkout')) cls += ' tag-checkout';
    return '<span class="' + cls + '">' + t.trim() + '</span>';
  }).join('');
}

function renderCard(p) {
  const compCls = p.competition === 'low' ? 'comp-low' : p.competition === 'med' ? 'comp-med' : 'comp-high';
  const compLabel = p.competition === 'low' ? 'Baixa' : p.competition === 'med' ? 'Media' : p.competition === 'high' ? 'Alta' : '?';
  const oppPct = Math.min(100, Math.round(p.opportunity * 1.1));
  const oppColor = oppPct >= 70 ? 'var(--green)' : oppPct >= 45 ? 'var(--yellow)' : 'var(--score-low)';
  const newCls = p.isNew ? ' is-new' : '';

  return '<div class="card' + newCls + '">' +
    '<div class="card-head">' +
      '<span class="card-name">' + p.name + '</span>' +
      '<span class="card-score ' + getScoreClass(p.score) + '">' + p.score + '</span>' +
    '</div>' +
    '<div class="card-meta">' +
      '<span class="cat-badge ' + getCatClass(p.cat) + '">' + p.cat + '</span>' +
      '<span class="variants-badge">' + p.offerCount + (p.offerCount > 1 ? ' variantes' : ' variante') + '</span>' +
    '</div>' +
    '<div class="card-geos">' + renderGeos(p.geos) + '</div>' +
    '<div class="card-tags">' + renderTags(p.tags) + '</div>' +
    '<div class="opp-bar"><div class="opp-fill" style="width:' + oppPct + '%;background:' + oppColor + '"></div></div>' +
    '<div class="card-bottom">' +
      '<span class="comp-indicator ' + compCls + '"><span class="comp-dot"></span> Concorrencia ' + compLabel + '</span>' +
      '<span style="font-family:var(--font-mono);font-weight:700;color:' + oppColor + '">OPP ' + p.opportunity + '%</span>' +
    '</div>' +
  '</div>';
}

function render() {
  let filtered = PRODUCTS.filter(p => {
    if (activeCategory && p.cat !== activeCategory) return false;
    if (searchTerm && !p.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    if (geoFilter && !p.geos.includes(geoFilter)) return false;
    return true;
  });

  if (sortBy === 'score') filtered.sort((a,b) => b.score - a.score);
  else if (sortBy === 'geos') filtered.sort((a,b) => b.geoCount - a.geoCount);
  else if (sortBy === 'variants') filtered.sort((a,b) => b.offerCount - a.offerCount);
  else if (sortBy === 'newest') filtered.sort((a,b) => b.newestId - a.newestId);
  else if (sortBy === 'opportunity') filtered.sort((a,b) => b.opportunity - a.opportunity);

  document.getElementById('grid').innerHTML = filtered.map(renderCard).join('');
  document.getElementById('results-info').textContent = 'Mostrando ' + filtered.length + ' de ' + PRODUCTS.length + ' produtos';

  const lowComp = filtered.filter(p => p.competition === 'low').length;
  const highScore = filtered.filter(p => p.score >= 110).length;
  const newCount = filtered.filter(p => p.isNew).length;
  const avgOpp = filtered.length ? Math.round(filtered.reduce((s,p) => s + p.opportunity, 0) / filtered.length) : 0;

  document.getElementById('stats-row').innerHTML =
    '<div class="stat-chip"><div class="num">' + PRODUCTS.length + '</div><div class="label">Produtos</div></div>' +
    '<div class="stat-chip"><div class="num">' + newCount + '</div><div class="label">Novos Hoje</div></div>' +
    '<div class="stat-chip"><div class="num">' + highScore + '</div><div class="label">Score 110+</div></div>' +
    '<div class="stat-chip"><div class="num">' + lowComp + '</div><div class="label">Baixa Concorr.</div></div>' +
    '<div class="stat-chip"><div class="num">' + avgOpp + '%</div><div class="label">Opp Media</div></div>';
}

function renderPills() {
  const pillsEl = document.getElementById('cat-pills');
  let html = '<span class="pill ' + (!activeCategory ? 'active' : '') + '" data-cat="">Todos</span>';
  categories.forEach(c => {
    html += '<span class="pill ' + (activeCategory === c ? 'active' : '') + '" data-cat="' + c + '">' + c + '</span>';
  });
  pillsEl.innerHTML = html;
  pillsEl.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      activeCategory = pill.dataset.cat;
      renderPills();
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { sortBy = e.target.value; render(); });
document.getElementById('geo-filter').addEventListener('change', e => { geoFilter = e.target.value; render(); });

renderPills();
render();
</script>
